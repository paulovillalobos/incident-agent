[project]
name = "incident-agent"
version = "0.1.0"
description = "An incident investigation agent for a small instrumented distributed system, evaluated against fault-injection ground truth."
readme = "README.md"
license = "MIT"
authors = [{ name = "Paulo Villalobos" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "psutil>=6.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.31 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
anthropic = ["anthropic>=0.40"]

[project.scripts]
ia = "incident_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-psutil"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "system", "tests"]
extend-exclude = ["ui"]

[tool.ruff.format]
# system/ is the code under investigation: scenario edits and reference fixes match its
# exact text, so it is never auto-formatted.
exclude = ["system/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"system/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "system"]
explicit_package_bases = true
packages = ["incident_agent", "services"]

[[tool.mypy.overrides]]
module = ["mlx_lm.*", "mlx.*", "anthropic.*", "opentelemetry.instrumentation.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not smoke"]
markers = ["smoke: starts the real system (slow, ~1 min)"]
