name = "pool_exhaustion"
title = "Checkout errors after the orders DB pool was shrunk"
duration_s = 45

[[events]]
at_s = 7
kind = "config"
service = "inventory"
author = "marta"
title = "inventory: drop log level override"
restart = ["inventory"]
edits = [
  { path = "config/inventory.toml", old = 'version = "2.0.6"', new = 'version = "2.0.7"' },
  { path = "config/inventory.toml", old = 'log_level = "INFO"', new = 'log_level = "WARNING"' },
]

[[events]]
at_s = 13
kind = "config"
service = "orders"
author = "joao"
title = "orders: right-size DB connection pool to cut idle connections"
restart = ["orders"]
culprit = true
edits = [
  { path = "config/orders.toml", old = 'version = "1.7.3"', new = 'version = "1.7.4"' },
  { path = "config/orders.toml", old = "pool_size = 10", new = "pool_size = 2" },
]

[ground_truth]
service = "orders"
category = "connection_pool_exhaustion"
change = "culprit"
explanation = "orders holds a pooled connection across its inventory and payments calls; with pool_size 2 requests time out waiting in db.pool.acquire."

[[reference_fix]]
path = "config/orders.toml"
old = "pool_size = 2"
new = "pool_size = 10"
